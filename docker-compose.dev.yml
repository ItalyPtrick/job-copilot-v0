# 开发环境：仅启动基础设施（PostgreSQL + Redis），API 和 Worker 在本地运行
# 用法：docker compose -f docker-compose.dev.yml up -d

name: job-copilot-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_dev_data:
  redis_dev_data:
